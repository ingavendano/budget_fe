<div class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <span class="material-symbols-outlined">account_balance_wallet</span>
          <span>Necuiltonolli</span>
        </div>
        <h1>Crear Cuenta</h1>
        <p>Regístrate para comenzar a gestionar tus finanzas</p>
      </div>

      <form class="auth-form" (submit)="handleRegister(); $event.preventDefault()">
        <div class="field-group">
          <label>Nombre Completo</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined">person</span>
            <input type="text" [ngModel]="name()" (ngModelChange)="name.set($event)" name="name"
              placeholder="Juan Pérez" required>
          </div>
        </div>

        <div class="field-group">
          <label>Correo Electrónico</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined">mail</span>
            <input type="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email"
              placeholder="ejemplo@correo.com" required>
          </div>
        </div>

        <div class="field-group">
          <label>Teléfono / WhatsApp</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined">call</span>
            <input type="tel" [ngModel]="phoneNumber()" (ngModelChange)="phoneNumber.set($event)" name="phone"
              mask="0000-0000" placeholder="0000-0000" [required]="true">
          </div>
        </div>

        <div class="field-group">
          <label>Contraseña</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined">lock</span>
            <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password"
              placeholder="Min. 6 caracteres" required minlength="6">
          </div>
        </div>

        <div *ngIf="error()" class="auth-error">
          <span class="material-symbols-outlined">error</span>
          <span>{{error()}}</span>
        </div>

        <button type="submit" class="auth-submit-btn" [disabled]="isLoading()">
          <span *ngIf="!isLoading()">Registrarse</span>
          <span *ngIf="isLoading()" class="loader"></span>
        </button>
      </form>

      <div class="auth-footer">
        <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia Sesión</a></p>
      </div>
    </div>
  </div>
</div>
