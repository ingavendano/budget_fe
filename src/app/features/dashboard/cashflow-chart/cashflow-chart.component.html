<div class="cashflow-card">

  <div class="cashflow-card__header">
    <span class="cashflow-card__title">Tendencias de flujo de efectivo</span>
    <span class="cashflow-card__badge">Últimos 30 días</span>
  </div>

  <!-- Loading skeleton -->
  @if (loading()) {
    <div class="cashflow-card__skeleton">
      <div class="skeleton-bars">
        <div class="skeleton-bar" style="height:60%"></div>
        <div class="skeleton-bar" style="height:80%"></div>
        <div class="skeleton-bar" style="height:50%"></div>
        <div class="skeleton-bar" style="height:90%"></div>
        <div class="skeleton-bar" style="height:70%"></div>
        <div class="skeleton-bar" style="height:85%"></div>
      </div>
    </div>
  }

  <!-- Error -->
  @if (!loading() && error()) {
    <div class="cashflow-card__error">
      <p>{{ error() }}</p>
      <button (click)="fetchData(year(), month())">Reintentar</button>
    </div>
  }

  <!-- Gráfica -->
  @if (!loading() && !error()) {
    <div class="cashflow-card__chart">
      <canvas #chartCanvas></canvas>
    </div>
  }

</div>
